# DISABLED. This workflow is switched off at the repository level while rewind
# is private: GitHub Actions minutes are not free on a private repository, and
# every job here failed before running a single step. Verification is local via
# `make check` until then — see CLAUDE.md.
#
# The file is kept, and kept working, because re-enabling it is part of #26:
#
#     gh workflow enable ci.yml
#
# `make check` covers fmt, clippy, test, msrv and audit, and development happens
# on both macOS and Fedora, so between the two machines the only leg with no
# local equivalent is `test (windows-latest)`. That is the job most likely to
# fail the first time this comes back on.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Nothing here writes to the repository. Stated explicitly so a job that starts
# needing more says so, rather than inheriting whatever the default happens to be.
permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          test -n "$version" || { echo "rust-version missing from Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      # The accepted advisories, with the reason for each, are in
      # .cargo/audit.toml. Anything not listed there — a new `unmaintained`
      # notice included — fails the job.
      - run: cargo audit --deny warnings

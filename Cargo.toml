[package]
name = "rewind"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal browser for Claude Code conversation history."
repository = "https://github.com/otaviocc/rewind"
license = "MIT"
readme = "README.md"
keywords = ["claude", "terminal", "tui", "history", "viewer"]
categories = ["command-line-utilities"]
# Files about developing rewind rather than using it. `themes/` stays: the
# theme loader's `include_str!` needs it to build the crate at all. `tests/`
# stays too, so a vendored copy can be verified.
exclude = ["CLAUDE.md", "Makefile", "rustfmt.toml", ".github/", ".cargo/", "tools/"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["osc52"] }
jiff = "0.2"
memchr = "2"
pulldown-cmark = "0.13"
ratatui = { version = "0.30", features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "3", default-features = false, features = ["text"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
thiserror = "2"
toml = "1"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process"] }

[dev-dependencies]
assert_cmd = "2"
insta = "1"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
